upstream catalog_backend {
    server catalog-1:8082;
    server catalog-2:8083;
}

server {
    listen 80;
    
    location /api/auth/ {
        proxy_pass http://auth:8081/;
    }
    
    location /api/catalog/ {
        proxy_pass http://catalog_backend/;
    }

    location /api/orders/health {
        proxy_pass http://order:8084/health;
    }

    location /api/orders {
        proxy_pass http://order:8084;
    }

    location /graphql {
        proxy_pass http://graphql:8085;
    }
}